<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dusky violet and peach horizon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1236"/>
      <stop offset="0.45" stop-color="#4a2c5f"/>
      <stop offset="0.72" stop-color="#a9617d"/>
      <stop offset="1" stop-color="#f4b39b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f5878"/>
      <stop offset="0.5" stop-color="#432c52"/>
      <stop offset="1" stop-color="#170f28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9d6" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#ffc9b0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffc9b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1c3f"/>
      <stop offset="1" stop-color="#150d24"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="820" cy="250" r="220" fill="url(#glow)"/>
  <circle cx="820" cy="250" r="86" fill="#ffe7d4" opacity="0.92"/>
  <circle cx="790" cy="228" r="20" fill="#e9bfa9" opacity="0.35"/>
  <circle cx="846" cy="276" r="13" fill="#e9bfa9" opacity="0.3"/>
  <path d="M0 470 C 170 420 290 452 430 480 C 590 512 700 462 860 470 C 1010 478 1100 500 1200 470 L1200 800 L0 800 Z" fill="url(#water)"/>
  <path d="M0 520 C 150 470 270 500 380 530 C 520 566 640 520 760 516 C 900 512 1060 552 1200 516 L1200 800 L0 800 Z" fill="url(#ridge)" opacity="0.82"/>
  <g stroke="#ffd9c6" stroke-linecap="round" opacity="0.4">
    <path d="M620 590 h230" stroke-width="3"/>
    <path d="M680 620 h300" stroke-width="2.4"/>
    <path d="M560 652 h210" stroke-width="2"/>
    <path d="M760 684 h250" stroke-width="1.6"/>
    <path d="M640 716 h170" stroke-width="1.4"/>
  </g>
  <g fill="#ffe9d8" opacity="0.7">
    <circle cx="210" cy="130" r="2.4"/>
    <circle cx="310" cy="88" r="1.7"/>
    <circle cx="430" cy="160" r="2"/>
    <circle cx="520" cy="96" r="1.4"/>
    <circle cx="1050" cy="140" r="2.2"/>
    <circle cx="1120" cy="240" r="1.5"/>
  </g>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.6"/>
</svg>
