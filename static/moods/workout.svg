<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Crimson motion streaks for a late workout">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12060a"/>
      <stop offset="0.5" stop-color="#3d0912"/>
      <stop offset="1" stop-color="#7a0f16"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4b2b" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ff6a3d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd07a" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="streak2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e63" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2e63" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff9a3d" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb066" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#ff4b2b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff4b2b" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="940" cy="240" r="290" fill="url(#pulse)"/>
  <g stroke="url(#streak)" stroke-linecap="round">
    <path d="M-80 610 C 300 470 560 690 850 520 C 1010 430 1120 460 1280 380" stroke-width="16" opacity="0.85"/>
    <path d="M-60 700 C 280 570 520 770 830 620 C 1010 530 1140 560 1290 490" stroke-width="8" opacity="0.55"/>
    <path d="M-100 500 C 250 380 470 560 740 420 C 930 322 1090 360 1300 260" stroke-width="4" opacity="0.5"/>
  </g>
  <g stroke="url(#streak2)" stroke-linecap="round">
    <path d="M-70 230 C 260 300 380 130 700 220 C 920 280 1080 170 1280 230" stroke-width="10" opacity="0.55"/>
    <path d="M-40 320 C 250 380 430 240 720 320 C 950 382 1100 280 1290 330" stroke-width="4" opacity="0.4"/>
  </g>
  <g fill="#0b0407" opacity="0.85">
    <rect x="120" y="540" width="52" height="260"/>
    <rect x="200" y="600" width="34" height="200"/>
    <rect x="270" y="500" width="64" height="300"/>
    <rect x="362" y="580" width="40" height="220"/>
    <rect x="430" y="640" width="80" height="160"/>
    <rect x="940" y="560" width="46" height="240"/>
    <rect x="1010" y="620" width="70" height="180"/>
    <rect x="1102" y="520" width="34" height="280"/>
  </g>
  <g fill="#ffd07a" opacity="0.75">
    <circle cx="300" cy="180" r="3"/>
    <circle cx="520" cy="120" r="2"/>
    <circle cx="1040" cy="620" r="2.5"/>
    <circle cx="1140" cy="140" r="1.8"/>
    <circle cx="760" cy="700" r="2.2"/>
  </g>
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.6"/>
</svg>
